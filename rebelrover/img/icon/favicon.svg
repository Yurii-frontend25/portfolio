<svg xmlns="http://w3.org" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7A61C" />
      <stop offset="100%" stop-color="#E85A19" />
    </linearGradient>
    <linearGradient id="botGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5" />
      <stop offset="100%" stop-color="#0D63B8" />
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="50" cy="50" r="46" />
    </clipPath>
  </defs>

  <!-- Круглая эмблема с оранжевым верхом и синим низом -->
  <g clip-path="url(#circleClip)">
    <rect x="0" y="0" width="100" height="52" fill="url(#topGrad)" />
    <rect x="0" y="50" width="100" height="50" fill="url(#botGrad)" />
  </g>

  <!-- Чёткий белый самолётик поверх эмблемы -->
  <g fill="#FFFFFF" transform="translate(50,52) rotate(-30) translate(-50,-52)">
    <path d="M-2,47.5 L88,47.5 C95,47.5 99,49.8 99,52 C99,54.2 95,56.5 88,56.5 L-2,56.5 Z" />
    <path d="M55,48 L33,15 L21,15 L37,48 Z" />
    <path d="M55,56 L33,89 L21,89 L37,56 Z" />
    <path d="M20,48 L9,32 L1,32 L10,48 Z" />
    <path d="M20,56 L9,72 L1,72 L10,56 Z" />
  </g>
</svg>